# Wersja testowa strony na GitHub Pages (noindex, baner „Wersja testowa”).
# Produkcja: npm run build i wgranie _site/ na OVHcloud – patrz README.
name: Wersja testowa (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Kontrola linków i SEO (wersja produkcyjna)
        run: npm run check
      # Do oceny przez właściciela: obok strony głównej także /origin/, /test/ i warianty /va/ /vb/ /vc/
      - name: Budowanie wersji testowej i wariantów
        run: |
          npx @11ty/eleventy
          for v in a b c; do
            VARIANT=$v PATH_PREFIX="${PATH_PREFIX}v$v/" npx @11ty/eleventy --output=_site/v$v
          done
        env:
          PATH_PREFIX: /${{ github.event.repository.name }}/
          TEST_SITE: "1"
          PREVIEWS: "1"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
